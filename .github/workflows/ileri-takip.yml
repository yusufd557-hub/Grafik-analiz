name: İleriye dönük takip

# Her saat başından 7 dakika sonra çalışır; 4 saatlik mum kapanışlarını en geç
# bir saat içinde kaydeder. Kayıtlar `ileri-takip` dalına commit edilir.
# GitHub zamanlanmış iş akışlarını yalnız varsayılan daldaki (main) dosyadan
# çalıştırır.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ileri-takip
  cancel-in-progress: false

jobs:
  kaydet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ileri-takip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-takip.txt
      - name: Paketler
        run: python -m pip install -r requirements-takip.txt
      - name: Veri önbelleği
        uses: actions/cache@v4
        with:
          path: ~/GrafikAnaliz/ileri_veri
          key: ileri-veri-${{ github.run_id }}
          restore-keys: ileri-veri-
      - name: Kaydet ve puanla
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m grafik_analiz.forward
      - name: Commit
        run: |
          git config user.name "grafik-analiz-takip"
          git config user.email "actions@users.noreply.github.com"
          git add ileri_takip
          if git diff --cached --quiet; then
            echo "Yeni kayıt yok"
          else
            git commit -m "İleriye dönük takip: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin HEAD:ileri-takip
          fi
