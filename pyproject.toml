[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grafik-analiz"
version = "0.1.0"
description = "Kripto para grafik analizi ve fiyat hareketi tahmini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "pyarrow>=15",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
grafik-analiz = "grafik_analiz.cli:main"

[tool.setuptools.packages.find]
include = ["grafik_analiz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
